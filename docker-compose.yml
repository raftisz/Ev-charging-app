# Local PostgreSQL for development. `docker compose up -d db`, then
# `npx prisma migrate dev && npm run seed`.
#
# Port 5433 on the host so it does not collide with an existing local
# Postgres on the default 5432.
services:
  db:
    image: postgres:16-alpine
    container_name: voltgrid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: voltgrid
      POSTGRES_PASSWORD: voltgrid
      POSTGRES_DB: voltgrid
    ports:
      - "5433:5432"
    volumes:
      - voltgrid-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltgrid -d voltgrid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voltgrid-pgdata:
