# Render blueprint. In Render: New → Blueprint → point at this repo.
#
# No database is declared here on purpose: Render's free plan allows only one
# active free PostgreSQL per account, so a blueprint that tries to create one
# fails with "cannot have more than one active free tier database" if you
# already have any. Create the database yourself (or reuse an existing one) and
# paste its Internal Database URL into DATABASE_URL when prompted.
#
# `npm start` runs `prisma migrate deploy` and seeds an empty database before
# serving, so the schema is always in place no matter how the host is set up.
services:
  - type: web
    name: volt-grid
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false # paste the database's Internal Database URL
      - key: JWT_SECRET
        generateValue: true
