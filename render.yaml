# Render blueprint. In Render: New → Blueprint → point at this repo.
#
# No database is declared here on purpose: Render's free plan allows only one
# active free PostgreSQL per account, so a blueprint that tries to create one
# fails with "cannot have more than one active free tier database" if you
# already have any. Create the database yourself (or reuse an existing one) and
# paste its Internal Database URL into DATABASE_URL when prompted.
#
# `npm start` runs `prisma migrate deploy` and seeds an empty database before
# serving, so the schema is always in place no matter how the host is set up.
# (Vercel never runs `start`; it uses the `vercel-build` script instead.)
services:
  - type: web
    name: volt-grid
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        # Paste the database's Internal Database URL. To share one Postgres
        # instance with another project, append `?schema=voltgrid`.
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # OCPP (optional): where the CSMS below is, e.g. https://volt-grid-csms.onrender.com.
      # Leave empty to run every charger as a simulated session.
      - key: OCPP_CSMS_URL
        sync: false
      - key: OCPP_COMMAND_SECRET
        fromService:
          type: web
          name: volt-grid-csms
          envVarKey: OCPP_COMMAND_SECRET

  # The OCPP 1.6J central system. Chargers (or `npm run ocpp:sim`) connect to
  # wss://volt-grid-csms.onrender.com/ocpp/<identity>. It needs a host that
  # keeps WebSockets open, which is why it can't live on Vercel.
  - type: web
    name: volt-grid-csms
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run ocpp:csms
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        # The same database as the app.
        sync: false
      - key: OCPP_COMMAND_SECRET
        generateValue: true
      - key: OCPP_CHARGER_PASSWORD
        # Optional: chargers must then send HTTP Basic <identity>:<password>.
        sync: false
