name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voltgrid
          POSTGRES_PASSWORD: voltgrid
          POSTGRES_DB: voltgrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voltgrid -d voltgrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://voltgrid:voltgrid@localhost:5432/voltgrid
      # Throwaway values that only exist for this job.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      CRON_SECRET: ci-only-cron-secret
      # Vercel runs in UTC; so do the tests, to keep Bangkok times honest.
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: |
          npm run test:tz
          npm run test:format
          npm run test:promptpay
          npm run test:photos
          npm run test:i18n

      - name: Apply migrations and seed
        run: |
          npx prisma migrate deploy
          npm run seed

      - name: Build
        run: npm run build

      - name: Start the app
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 2
          done
          cat server.log
          exit 1

      - name: API tests
        run: npm run test:api

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: |
          npm run seed
          npm run test:ui

      - name: Upload screenshots and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug
          path: |
            tests/screenshots
            server.log
          if-no-files-found: ignore
